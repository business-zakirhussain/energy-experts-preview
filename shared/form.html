<form id="enq" class="rv rv-d1" novalidate>
  <div class="f2">
    <div><label for="fn" data-i18n="f1">Name</label><input id="fn" type="text" required></div>
    <div><label for="fc" data-i18n="f2">Company</label><input id="fc" type="text"></div>
  </div>
  <div class="f2">
    <div><label for="fe" data-i18n="f3">Email</label><input id="fe" type="email" required></div>
    <div><label for="fs" data-i18n="f4">Service</label><select id="fs">
      <option data-i18n="o1">Electrical classification</option><option data-i18n="o2">Offshore wind</option>
      <option data-i18n="o3">Solar PV inspection</option><option data-i18n="o4">Something else</option></select></div>
  </div>
  <div><label for="fm" data-i18n="f5">Describe the installation</label><textarea id="fm" required></textarea></div>
  <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
  <label class="consent"><input type="checkbox" required><span data-i18n="f6">I agree that Energy Experts BV may store and use these details to answer my enquiry, as described in the privacy policy.</span></label>
  <button class="btn btn-a" type="submit" data-i18n="f7">Send enquiry</button>
  <p class="form-note" id="fnote" data-i18n="f8">Demo form — nothing is sent</p>
</form>
