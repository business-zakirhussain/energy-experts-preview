# Every push to main (including every save in Pages CMS) rebuilds the site
# and deploys it to Cloudflare Pages. A bad JSON file fails the build and
# the live site stays on the last good version.
name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pillow==10.4.0

      - name: Build
        run: python build.py

      - name: Deploy to Cloudflare Pages
        if: env.HAS_CF == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy deploy --project-name=energy-experts --branch=main

      - name: Cloudflare not connected yet
        if: env.HAS_CF != 'true'
        run: echo "::notice::Build passed. Deploy skipped - add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to enable."
